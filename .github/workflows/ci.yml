name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  WASMTIME_VERSION: v48.0.1

jobs:
  static:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"
      - name: Cache the Wasmtime C API
        uses: actions/cache@v4
        with:
          path: _build/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasmtime.version') }}
      - name: Install clang-format and shellcheck
        run: sudo apt-get update && sudo apt-get install -y clang-format shellcheck
      - run: rebar3 fmt --check
      - run: clang-format --dry-run -Werror c_src/*.c
      - run: shellcheck scripts/*.sh
      - name: fetch-wasmtime.sh, every branch, offline
        run: scripts/test-fetch.sh
      - run: rebar3 compile
      - name: build-nif.sh refuses headers and library from different builds
        run: |
          API="$(scripts/fetch-wasmtime.sh)"
          mkdir -p mixed && ln -s "$API/include" mixed/include && ln -s "$API/min/lib" mixed/lib
          if WASMTIME_C_API_DIR="$PWD/mixed" scripts/build-nif.sh 2>err; then
            echo "expected a failure"; exit 1
          fi
          grep -q "disagree about compiler" err
      - name: build-nif.sh probes the library without nm
        run: |
          # the whole toolchain except nm, so the link-test probe is what runs
          mkdir -p nonm
          for p in /usr/bin/* /bin/*; do [ -d "$p" ] || ln -sfn "$p" "nonm/$(basename "$p")"; done
          rm -f nonm/nm
          ln -sf "$(command -v erl)" nonm/erl
          touch c_src/wasmtime_nif.c
          PATH="$PWD/nonm" scripts/build-nif.sh 2>&1 | grep "compiler=1 wat=1 wasi=1"
          test -f _build/probe.c
      - run: rebar3 lint
      - run: rebar3 xref
      - run: rebar3 dialyzer
      - name: Hex package stays under the 8 MB cap
        run: |
          rebar3 hex build
          f=$(ls _build/default/lib/erlang_wasmtime/hex/erlang_wasmtime-*.tar | grep -v docs)
          ls -la "$f"
          test "$(stat -c %s "$f")" -lt 8000000

  test:
    name: Test OTP ${{ matrix.otp }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            otp: "27"
          - os: ubuntu-24.04
            otp: "28"
          - os: macos-15
            otp: "28"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Wasmtime C API
        uses: actions/cache@v4
        with:
          path: _build/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasmtime.version') }}

      - name: Install Erlang (Linux)
        if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.24.0"

      - name: Install Erlang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install erlang@${{ matrix.otp }} rebar3
          echo "$(brew --prefix erlang@${{ matrix.otp }})/bin" >> "$GITHUB_PATH"

      - run: rebar3 compile
      - run: rebar3 ct
      - name: Upload CT logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-${{ matrix.os }}-otp${{ matrix.otp }}
          path: _build/test/logs

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"
      - name: Cache the Wasmtime C API
        uses: actions/cache@v4
        with:
          path: _build/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasmtime.version') }}
      - name: Build the NIF under ASan
        run: WASMTIME_NIF_SANITIZE=address rebar3 compile
      # The runtime must be in the emulator before the NIF loads. Leak
      # checking is off: the emulator's own exit-time state would drown the
      # report; every other class of error aborts the run.
      - name: Run the suites with the ASan runtime preloaded
        run: |
          ASAN_RT="$(gcc -print-file-name=libasan.so)"
          test -f "$ASAN_RT"
          LD_PRELOAD="$ASAN_RT" \
          ASAN_OPTIONS="detect_leaks=0:abort_on_error=1:alloc_dealloc_mismatch=0" \
          rebar3 ct
      - name: Upload CT logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-asan
          path: _build/test/logs

  runtime-only:
    name: Runtime-only on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Wasmtime C API and source builds
        uses: actions/cache@v4
        with:
          path: _build/wasmtime
          key: wasmtime-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasmtime.version', 'scripts/build-wasmtime.sh') }}
      - name: Install Erlang (Linux)
        if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"
      - name: Install Erlang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install erlang@28 rebar3
          echo "$(brew --prefix erlang@28)/bin" >> "$GITHUB_PATH"
      # A Rust toolchain, for the source build that runs until the platform
      # has a published runtime archive (scripts/wasmtime-runtime.sha256).
      - name: Install Rust and cmake
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          which cmake >/dev/null || (sudo apt-get update && sudo apt-get install -y cmake)
      - name: Full build, precompile the fixtures
        run: |
          rebar3 compile
          escript scripts/precompile-fixtures.escript test/wasmtime_runtime_only_SUITE_data _build/cwasm
      - name: Runtime-only build and suite
        run: |
          WASMTIME_RUNTIME_ONLY=1 rebar3 compile
          ls -la priv
          WASMTIME_RUNTIME_ONLY=1 WASMTIME_CWASM_DIR="$PWD/_build/cwasm" rebar3 ct
      - name: Upload CT logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-runtime-only-${{ matrix.os }}
          path: _build/test/logs

  freebsd:
    name: Test on FreeBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Wasmtime publishes no FreeBSD archive; fetch-wasmtime.sh downloads this
      # project's or falls back to a source build inside the VM. The cache
      # lives in the workspace so it is copied back, keyed by version.
      - name: Cache the Wasmtime C API for FreeBSD
        uses: actions/cache@v4
        with:
          path: _build/wasmtime
          key: wasmtime-freebsd-14-${{ hashFiles('scripts/wasmtime.version', 'scripts/build-wasmtime.sh') }}

      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          envs: "WASMTIME_VERSION"
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y erlang rebar3 git cmake rust curl
          run: |
            set -e
            erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
            rebar3 compile
            rebar3 ct
            escript scripts/precompile-fixtures.escript test/wasmtime_runtime_only_SUITE_data _build/cwasm
            WASMTIME_RUNTIME_ONLY=1 rebar3 compile
            WASMTIME_RUNTIME_ONLY=1 WASMTIME_CWASM_DIR="$PWD/_build/cwasm" rebar3 ct
            # the source tree is large and not worth caching
            rm -rf _build/wasmtime/*/wasmtime-src _build/wasmtime/*/build-*
